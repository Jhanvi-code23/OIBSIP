<!-- WE NEED username/Email, Password, Remember Me, Login button, Don't have an account?, Register link -->

<!DOCTYPE html>
<html lang="en">

<head>
    <title>CheckMate | Login</title>
    
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="auth-container">
        <div class="auth-card">
            <img src="assets/logo.png" alt="CheckMate Logo" class="logo">
            <h1>CheckMate</h1>
            <p>Welcome Back!</p>
            
            <form id="loginForm">
                
                <input
                    type="text"
                    id="loginInput"
                    placeholder="Username or Email">
                
                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        placeholder="Password">
                    <i class="fa-solid fa-eye togglePassword"></i>
                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="bottom-text">
                Don't have an account?
                <a href="register.html">
                    Register
                </a>
            </p>

            <!-- Message -->
            <p id="message"></p>
        </div>
    </div>

    
    <script src="hash.js"></script>
    <script src="auth.js"></script>
    <script src="login.js"></script>
    <script src="password.js"></script>

</body>

</html>
